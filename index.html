<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>MAÇ ANALİZ PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 15px;background:#152238;text-align:center;border-bottom:2px solid #15c68e}
h1{color:#22e4a6;margin:0;font-size:25px}
header p{color:#b5c5d5;font-size:12px}
main{max-width:850px;margin:auto;padding:15px}
nav{display:flex;gap:10px;margin-bottom:15px}
button{border:0;border-radius:9px;background:#273951;color:white;padding:12px;cursor:pointer}
button.active{background:#12a77a}
input{width:100%;background:#1d2d43;color:white;padding:14px;border:1px solid #40536a;border-radius:10px}
.match{background:#18283e;border:1px solid #33465d;border-radius:12px;margin:10px 0;padding:15px;cursor:pointer}
.league{font-size:12px;color:#24dba5;margin:18px 0 7px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:10px}
.teams b{flex:1;font-size:14px}
.teams b:last-child{text-align:right}
.score{color:#ffd06d;white-space:nowrap}
.details{display:none;border-top:1px solid #3b4d62;margin-top:12px;padding-top:12px;color:#c7d5e5;font-size:13px;line-height:1.9}
.match.open .details{display:block}
small,.note{color:#a6b7ca}
.note{font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header><h1>⚽ MAÇ ANALİZ PRO</h1><p>Gerçek maçlar • Skorlar • İstatistikler</p></header>
<main>
<nav><button id="b0" class="active" onclick="changeDay(0)">Bugün</button><button id="b1" onclick="changeDay(1)">Yarın</button></nav>
<input id="search" placeholder="Takım veya lig ara..." oninput="render()">
<h3 id="heading">Maçlar yükleniyor...</h3>
<p id="status"></p>
<div id="matches"></div>
<p class="note">Veriler API-Football üzerinden GitHub'a kaydedilen son güncellemeden alınır. Ücretsiz pakette bazı ligler ve istatistikler bulunmayabilir.</p>
</main>
<script>
let fixtures=[],day=0,loaded=false;
const tz="Europe/Istanbul";
function dateKey(d){
return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}
function changeDay(n){
day=n;
document.getElementById("b0").className=n===0?"active":"";
document.getElementById("b1").className=n===1?"active":"";
render();
}
function safe(s){
return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function loadMatches(){
try{
const r=await fetch("./data/maclar.json?v="+Date.now(),{cache:"no-store"});
if(!r.ok)throw Error("HTTP "+r.status);
const data=await r.json();
if(!Array.isArray(data))throw Error("Veri biçimi geçersiz");
fixtures=data;
loaded=true;
render();
}catch(e){
document.getElementById("status").textContent="Veriler yüklenemedi: "+e.message;
}
}
function render(){
const now=new Date();
const target=new Date(now.toLocaleString("en-US",{timeZone:tz}));
target.setDate(target.getDate()+day);
const key=dateKey(target);
document.getElementById("heading").textContent=(day===0?"Bugünün":"Yarının")+" Maçları";
const q=document.getElementById("search").value.toLocaleLowerCase("tr");
const list=fixtures.filter(m=>{
const d=new Date(m.date);
return !isNaN(d)&&dateKey(d)===key&&(m.home+" "+m.away+" "+m.league+" "+m.country).toLocaleLowerCase("tr").includes(q);
}).sort((a,b)=>new Date(a.date)-new Date(b.date));
document.getElementById("status").textContent=loaded?list.length+" maç bulundu":"Maçlar yükleniyor...";
let html="",lastLeague="";
for(const m of list){
const league=(m.country||"")+" • "+(m.league||"");
if(league!==lastLeague){html+='<div class="league">'+safe(league)+'</div>';lastLeague=league;}
const time=new Date(m.date).toLocaleTimeString("tr-TR",{timeZone:tz,hour:"2-digit",minute:"2-digit"});
const g=m.goals||{};
const score=g.home!=null&&g.away!=null?g.home+" - "+g.away:time;
html+='<article class="match" onclick="this.classList.toggle(\'open\')"><div class="teams"><b>'+safe(m.home)+'</b><span class="score">'+safe(score)+'</span><b>'+safe(m.away)+'</b></div><div class="details">Başlangıç: '+safe(time)+'<div>Durum: '+safe(m.status||"Bilinmiyor")+'</div><div>Gol: '+safe(g.home??"-")+' / '+safe(g.away??"-")+'</div><div>Korner, takım formu ve son maç analizleri sonraki güncellemede eklenecek.</div></div></article>';
}
document.getElementById("matches").innerHTML=html||"<p>Bu tarihte erişilebilir maç bulunamadı.</p>";
}
render();
loadMatches();
</script>
</body>
</html>
