<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>MAÇ ANALİZ PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f3f6ff;font-family:Arial,sans-serif}header{background:#152238;padding:22px 16px;text-align:center;border-bottom:2px solid #21c58b}h1{font-size:24px;margin:0;color:#21e5a1}header p{font-size:12px;color:#a9b7ca}main{max-width:850px;margin:auto;padding:15px}.bar{display:flex;gap:8px;margin:15px 0}button,input{border:0;border-radius:9px;padding:12px;font-size:14px}button{background:#243750;color:white;cursor:pointer}.active{background:#13a779;color:white}.match{background:#18263a;border:1px solid #31425a;border-radius:13px;padding:16px;margin:12px 0;cursor:pointer}.league{font-size:12px;color:#8eeac8;margin-bottom:10px}.teams{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:bold}.teams span{flex:1}.teams span:last-child{text-align:right}.time{color:#ffcd6a;font-size:14px;flex:0!important;text-align:center}.details{display:none;border-top:1px solid #35465a;margin-top:15px;padding-top:12px;color:#c8d6e8;font-size:14px;line-height:1.8}.match.open .details{display:block}.note{color:#aebdd0;font-size:13px;line-height:1.6}input{width:100%;background:#223149;color:white}#status{color:#ffcd6a;font-size:13px}
</style>
</head>
<body>
<header><h1>⚽ MAÇ ANALİZ PRO</h1><p>Günlük maçlar • İstatistikler • Kişisel analiz</p></header>
<main>
<div class="bar"><button class="active" id="today" onclick="changeDay(0)">Bugün</button><button id="tomorrow" onclick="changeDay(1)">Yarın</button></div>
<input id="search" placeholder="Takım veya lig ara..." oninput="render()">
<h3 id="heading">Günün Maçları</h3>
<p id="status"></p><div id="matches"></div>
<p class="note">Bu ilk sürüm örnek maç verileriyle arayüzü test etmek içindir. Canlı fikstür ve gerçek istatistikler henüz bağlı değildir. Gerçek veriler için sonraki aşamada futbol veri servisi ekleyeceğiz.</p>
</main>
<script>
let day=0;
const fixtures=[
{league:"Türkiye Süper Lig",home:"Fenerbahçe",away:"Galatasaray",time:"20:00"},
{league:"İngiltere Premier League",home:"Arsenal",away:"Liverpool",time:"19:30"},
{league:"İspanya La Liga",home:"Real Madrid",away:"Barcelona",time:"22:00"},
{league:"Almanya Bundesliga",home:"Bayern Münih",away:"Dortmund",time:"21:30"},
{league:"İtalya Serie A",home:"Inter",away:"Milan",time:"21:45"},
{league:"Fransa Ligue 1",home:"PSG",away:"Marsilya",time:"22:00"}
];
function changeDay(n){day=n;document.getElementById("today").className=n===0?"active":"";document.getElementById("tomorrow").className=n===1?"active":"";render()}
function render(){
const date=new Date();date.setDate(date.getDate()+day);
document.getElementById("heading").textContent=date.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"})+" — Demo";
const q=document.getElementById("search").value.toLocaleLowerCase("tr");
const list=fixtures.filter(m=>(m.home+" "+m.away+" "+m.league).toLocaleLowerCase("tr").includes(q));
document.getElementById("status").textContent="Örnek karşılaşmalar — gerçek fikstür değildir.";
document.getElementById("matches").innerHTML=list.length?list.map(m=>'<article class="match" onclick="this.classList.toggle(\'open\')"><div class="league">'+m.league+'</div><div class="teams"><span>'+m.home+'</span><span class="time">'+m.time+'</span><span>'+m.away+'</span></div><div class="details"><b>Maç Detayları</b><div>Takım formu: Veri bağlantısı bekleniyor</div><div>Gol ortalamaları: Veri bağlantısı bekleniyor</div><div>Korner ortalamaları: Veri bağlantısı bekleniyor</div><div>Karşılıklı maçlar: Veri bağlantısı bekleniyor</div><div>Analiz: Gerçek istatistikler bağlandığında hazırlanacak.</div></div></article>').join(""):"<p>Aramanla eşleşen maç bulunamadı.</p>";
}
render();
</script>
</body>
</html>
